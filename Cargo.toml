[package]
name = "tbon"
version = "0.9.0"
authors = ["code@tinychain.net"]
edition = "2021"
description = "TinyChain Binary Object Notation is a compact and versatile stream-friendly binary serialization format"
repository = "https://github.com/TinyChain-Inc/tbon"
readme = "README.md"
license = "Apache-2.0"

categories = ["asynchronous", "encoding", "parser-implementations", "parsing", "web-programming"]
keywords = ["binary", "stream", "decode", "serialize", "deserialize"]

[features]
default = []
tokio-io = ["tokio/io-util"]
all = ["tokio-io"]

[dependencies]
bytes = "1.10"
destream = { path = "../destream", version = "0.10.0" }
futures = "0.3"
num-traits = "0.2"
num-derive = "0.4"
pin-project = "1.1"
trait-variant = "0.1.2"
tokio = { version = "1.43", features = ["io-util"], optional = true }
uuid = "1.13"

[dev-dependencies]
criterion = "0.5"
rand = "0.9"
tokio = { version = "1.43", features = ["macros"] }
tokio-test = "0.4"

[[bench]]
name = "chunk_size"
harness = false

[[bench]]
name = "encode"
harness = false
